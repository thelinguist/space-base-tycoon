<svg xmlns="http://www.w3.org/2000/svg" width="128" height="120" viewBox="0 0 128 120">
  <!-- 2x2 footprint: diamond (64,56) (128,88) (64,120) (0,88), center (64,88) -->
  <ellipse cx="68" cy="92" rx="62" ry="27" fill="#000" opacity="0.25"/>
  <!-- concrete pad sides -->
  <polygon points="2,85 64,116 64,120 2,89" fill="#8a929d"/>
  <polygon points="64,116 126,85 126,89 64,120" fill="#6b737d"/>
  <!-- pad top -->
  <polygon points="64,54 126,85 64,116 2,85" fill="#b9c0c9"/>
  <polygon points="64,54 126,85 64,116 2,85" fill="none" stroke="#8a929d" stroke-width="0.8"/>
  <!-- hazard marking -->
  <polygon points="64,62 110,85 64,108 18,85" fill="none" stroke="#e07a2e" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- tower base plate -->
  <polygon points="64,80 82,89 64,98 46,89" fill="#a5adb8"/>
  <polygon points="64,80 82,89 64,98 46,89" fill="none" stroke="#6b737d" stroke-width="0.8"/>
  <!-- lattice tower -->
  <line x1="50" y1="89" x2="61" y2="50" stroke="#6b737d" stroke-width="2"/>
  <line x1="78" y1="89" x2="67" y2="50" stroke="#4a525c" stroke-width="2"/>
  <line x1="64" y1="96" x2="64" y2="50" stroke="#5a626c" stroke-width="2"/>
  <line x1="53" y1="78" x2="75" y2="78" stroke="#6b737d" stroke-width="1"/>
  <line x1="56" y1="66" x2="72" y2="66" stroke="#6b737d" stroke-width="1"/>
  <line x1="53" y1="78" x2="72" y2="66" stroke="#5a626c" stroke-width="1"/>
  <line x1="75" y1="78" x2="56" y2="66" stroke="#5a626c" stroke-width="1"/>
  <!-- turret head -->
  <polygon points="57,46 64,49.5 64,56 57,52.5" fill="#d9dde3"/>
  <polygon points="64,49.5 71,46 71,52.5 64,56" fill="#a5adb8"/>
  <polygon points="64,42.5 71,46 64,49.5 57,46" fill="#eef1f4"/>
  <!-- dish -->
  <g transform="rotate(-24 64 32)">
    <ellipse cx="64" cy="32" rx="31" ry="14" fill="#eef1f4"/>
    <ellipse cx="64" cy="33" rx="27" ry="11" fill="#a5adb8"/>
    <ellipse cx="65" cy="35" rx="18" ry="6.5" fill="#8f98a3"/>
    <ellipse cx="64" cy="32" rx="31" ry="14" fill="none" stroke="#8a929d" stroke-width="0.8"/>
    <line x1="44" y1="30" x2="64" y2="10" stroke="#6b737d" stroke-width="1"/>
    <line x1="84" y1="30" x2="64" y2="10" stroke="#6b737d" stroke-width="1"/>
    <line x1="64" y1="34" x2="64" y2="10" stroke="#6b737d" stroke-width="1.5"/>
    <circle cx="64" cy="9" r="2.5" fill="#e07a2e"/>
  </g>
  <!-- control hut, front-left -->
  <polygon points="20,82 34,89 34,101 20,94" fill="#d9dde3"/>
  <polygon points="34,89 48,82 48,94 34,101" fill="#a5adb8"/>
  <polygon points="34,75 48,82 34,89 20,82" fill="#eef1f4"/>
  <polygon points="34,75 48,82 34,89 20,82" fill="none" stroke="#8a929d" stroke-width="0.8"/>
  <polygon points="20,91 34,98 34,100 20,93" fill="#e07a2e"/>
  <polygon points="34,98 48,91 48,93 34,100" fill="#b35d1f"/>
  <polygon points="24,86 29,88.5 29,93 24,90.5" fill="#ffd66b"/>
  <polygon points="38,91 44,88 44,95 38,98" fill="#4a525c"/>
  <!-- beacon -->
  <line x1="46" y1="83" x2="46" y2="68" stroke="#6b737d" stroke-width="1"/>
  <circle cx="46" cy="67" r="1.6" fill="#ff4d4d"/>
</svg>
