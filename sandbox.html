<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sandbox · Space Base Tycoon</title>
    <style>
      /* Pixel-art chrome: monospace, square corners, hard 2px borders.
         Colors mirror the UI_* palette in src/constants/color.ts. */
      :root {
        --panel: #2a1a22;
        --border: #5c3a48;
        --button: #3d2631;
        --accent: #e07a2e;
        --text: #f2e6d8;
        --bg: #1a0f14;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        grid-template-columns: 200px 1fr;
        grid-template-rows: auto 1fr;
        background: var(--bg);
        color: var(--text);
        font: bold 12px monospace;
      }
      #scenes {
        grid-row: 1 / span 2;
        background: var(--panel);
        border-right: 2px solid var(--border);
        padding: 8px;
        overflow-y: auto;
      }
      #scenes h1 {
        font-size: 12px;
        margin: 0 0 8px;
        letter-spacing: 1px;
      }
      #toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        padding: 8px;
        background: var(--panel);
        border-bottom: 2px solid var(--border);
      }
      button,
      input {
        font: inherit;
        color: var(--text);
        background: var(--button);
        border: 2px solid var(--border);
        border-radius: 0;
        padding: 4px 8px;
      }
      button:hover {
        border-color: var(--text);
      }
      button.active {
        border-color: var(--accent);
      }
      #scenes button {
        display: block;
        width: 100%;
        text-align: left;
        margin-bottom: 4px;
      }
      #seed {
        width: 7em;
      }
      #time {
        flex: 1;
        min-width: 120px;
        accent-color: var(--accent);
        padding: 0;
        border: none;
        background: none;
      }
      #clock {
        min-width: 11ch;
        text-align: right;
      }
      .group {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      #stage {
        position: relative;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <nav id="scenes"><h1>SCENES</h1></nav>
    <div id="toolbar">
      <div class="group">
        <button id="back" title="Step back (←)">◀▮</button>
        <button id="play" title="Play/pause (space)">▶</button>
        <button id="forward" title="Step forward (→)">▮▶</button>
      </div>
      <input id="time" type="range" min="0" value="0" />
      <span id="clock">0.00s</span>
      <div class="group" id="speeds"></div>
      <div class="group">
        <label for="seed">SEED</label>
        <input id="seed" type="number" step="1" />
        <button id="reseed" title="New random seed">NEW</button>
      </div>
      <button id="grid" title="Tile grid and coordinates (g)">GRID</button>
    </div>
    <main id="stage"></main>
    <script type="module" src="/src/sandbox/main.ts"></script>
  </body>
</html>
